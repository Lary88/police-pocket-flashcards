<div class="toolbar"><button class="btn" id="random">⤨ 隨機抽題</button><button class="btn" id="all">題庫統計</button><button class="btn" id="import">匯入 CSV</button><input type="file" id="file" accept=".csv,text/csv"></div><p class="notice" id="info">已整理 113 年行政法 50 題與逐題考點解析。解析為學習整理，非官方解答；法規適用以最新法令及官方更正為準。作答紀錄保存在本裝置瀏覽器。</p><p class="notice">原始資料：<a style="color:#a9c47c" target="_blank" rel="noopener" href="https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?t=Q&amp;code=113170&amp;c=101&amp;s=0202&amp;q=1">考題 PDF</a>　<a style="color:#a9c47c" target="_blank" rel="noopener" href="https://wwwq.moex.gov.tw/exam/wHandExamQandA_File.ashx?t=M&amp;code=113170&amp;c=101&amp;s=0202&amp;q=1">官方答案 PDF</a>　<a style="color:#a9c47c" target="_blank" rel="noopener" href="https://kaonow.com/paper/policepromo-8b7f1efc-moex-113-3082b5f1/">試題彙整頁</a></p></main><footer class="nav"><button class="btn" id="review">錯題複習</button><button class="btn" id="favorites">收藏卡片</button><button class="btn" id="reset">重置進度</button></footer>
<script>
const demo=[{"id":"113-行政法-01","year":"113","subject":"行政法","tag":"行政法","q":"有關無效行政處分，下列敘述何者正確？","opts":["自始不生效力，但例外時得使其向將來失效","行政機關得依職權向法院提起無效確認之訴","利害關係人有正當理由得請求確認無效與否","無效行政處分未經撤銷者，其效力繼續存在"],"a":3,"ex":"行政處分無效之確認：利害關係人有正當理由時，得請求確認。","detail":"行政程序法第111條規範無效事由；無效處分自始不生效力。依第113條，利害關係人有正當理由得請求確認無效，並非由行政機關向法院提起確認之訴。"},{"id":"113-行政法-02","year":"113","subject":"行政法","tag":"行政法","q":"依我國司法實務見解，下列何者係屬行政處分？","opts":["行政院依地方制度法認定地方議會通過自治條例為無效之函告","經認定為違建後，行政機關通知人民應自行拆除之日期通知單","學校性平會就校園性騷擾事件，所作成之調查報告及處理建議","人民違反道路交通管理處罰條例，由交通勤務警察所為之舉發"],"a":1,"ex":"行政處分須為行政機關就公法上具體事件所為、對外直接發生法律效果之單方行政行為。","detail":"行政處分須由行政機關就公法上具體事件所為，並對外直接發生法律效果。地方自治條例被宣告無效的函告具有直接法律效果，與單純通知、調查報告或警察舉發等行為須依其性質區辨。"},{"id":"113-行政法-03","year":"113","subject":"行政法","tag":"行政法","q":"依工會法施行細則規定，廠場工作場所之獨立人事、預算及會計要件，依憲法法庭判決意旨，牴觸下列何種原則？","opts":["比例原則","平等原則","法律保留原則","正當法律程序原則"],"a":3,"ex":"本題考憲法法庭對工會組織及法律保留的判斷。","detail":"本題考法律保留：限制工會組織及團結權的重要構成要件，應由法律或有明確授權的法規命令規定；施行細則不得自行增加法律未授權的實質限制。"},{"id":"113-行政法-04","year":"113","subject":"行政法","tag":"行政法","q":"依行政訴訟法，有關行政訴訟之和解，下列敘述何者錯誤？","opts":["和解成立者，有確定力","當事人須就訴訟標的具有處分權","和解之範圍，限於與訴訟標的相關之事項","和解有得撤銷之原因者，當事人得請求繼續審判"],"a":3,"ex":"行政訴訟和解成立具有確定力；撤銷和解有特別救濟規定。","detail":"行政訴訟法上的和解具有確定判決效力，並非僅限於訴訟標的本身；與訴訟標的相關且當事人有處分權的事項，也可能納入和解。和解有法定無效或得撤銷原因時，依特別程序救濟。"},{"id":"113-行政法-05","year":"113","subject":"行政法","tag":"行政法","q":"下列何種程序屬訴願先行程序之性質？","opts":["公務人員保障法之復審程序","政府採購法之異議程序","教師法之再申訴程序","公務人員保障法之再申訴程序"],"a":2,"ex":"政府採購異議屬於先行救濟程序的典型考點。","detail":"政府採購法異議、申訴是採購爭議的法定先行救濟程序；須依採購法規定先向招標機關提出異議，必要時再向採購申訴審議委員會申訴，與一般訴願程序不同。"},{"id":"113-行政法-06","year":"113","subject":"行政法","tag":"行政法","q":"下列何者不是行政事實行為？","opts":["氣象報告之颱風預測","快速道路之施工行為","街道門牌之更名編定","地方政府之垃圾清運"],"a":3,"ex":"門牌更名編定會直接形成法律效果，與單純事實行為不同。","detail":"行政事實行為原則上不直接形成法律效果，例如施工、清運、氣象資訊。門牌更名編定會確定地址識別，影響人民權利義務及法律關係，具有行政處分性質。"},{"id":"113-行政法-07","year":"113","subject":"行政法","tag":"行政法","q":"下列何種行為，並非行政程序法第92條所稱之行政處分？","opts":["匝道管制","建築線之指定","提供產業發展資訊","水源保護區之公告"],"a":3,"ex":"單純提供資訊通常不直接發生法律效果，非行政處分。","detail":"行政處分要有對外直接法律效果。單純提供產業資訊屬事實通知或資訊提供，通常不直接設定、變更或消滅人民公法上權利義務，因此不是行政程序法第92條的行政處分。"},{"id":"113-行政法-08","year":"113","subject":"行政法","tag":"行政法","q":"有關公共設施委託民間團體管理時，其國家賠償責任之成立與責任歸屬問題，下列敘述何者正確？","opts":["由受委託民間團體自負國賠責任","就損害原因有應負責任之人時，由受損害人民對其主張國賠責任","於開放水域，民間團體已適當警告而人民仍從事危險活動，國家不負國賠責任","於開放山域設施已適當警告而人民仍冒險，國家不負國賠責任"],"a":3,"ex":"公共設施委託管理及開放水域、山域的國賠責任有特別規範。","detail":"公共設施委託民間管理時，國家賠償責任不當然因委託而消失；仍須依國家賠償法及公共設施管理規範判斷。開放水域如已適當警告，而人民仍從事具高度危險活動，法律設有責任減免的特別規定。"},{"id":"113-行政法-09","year":"113","subject":"行政法","tag":"行政法","q":"下列何者並不屬於有關公物一般使用之設定？","opts":["因消防隊救火需要而排除私人路障","將私人所有之老宅指定為歷史古蹟","因應交通尖峰時段所為之調撥車道","將私人加油站所設廁所指定為公廁"],"a":1,"ex":"公物一般使用設定與排除障礙、古蹟指定等概念需區辨。","detail":"公物一般使用是人民依公物目的通常使用。消防救火時排除私人路障，是排除妨害、執行公權力的事實措施，不是設定公物一般使用；指定古蹟、公廁等則涉及特定公物或公共使用關係。"},{"id":"113-行政法-10","year":"113","subject":"行政法","tag":"行政法","q":"下列何者為行政處分？","opts":["聽證程序主持人對於當事人聲明異議所為之駁回","行政機關基於職權對特定當事人依法所為之送達","行政機關進行權限委託時向其他機關所為之委託","土地主管機關就不動產交易標的物所為之登記"],"a":4,"ex":"不動產登記的法律性質須依其具體法規及效果判斷。","detail":"不動產登記不是單純內部作業；登記機關依法律審查並作成登記，會發生公法上的法律效果。判斷行政處分應看是否對外直接發生法律效果，而非名稱是否為通知或登記。"},{"id":"113-行政法-11","year":"113","subject":"行政法","tag":"行政法","q":"有關公營造物利用關係之敘述，下列何者錯誤？","opts":["其利用關係，得基於營造物利用規則而生","其利用型態，得為公法利用關係或私法利用關係","基於對內有家主權，而得排除檢調或司法人員之進入","其利用型態，基本上由法規或公營造物主體裁量定之"],"a":1,"ex":"公營造物管理權並非可概括排除檢調或司法機關依法執行職務。","detail":"公營造物管理者得依利用規則維持秩序，但所謂家主權不是無限制的排除權。檢察、司法或警察機關依法執行職務時，管理者不得僅以內部管理權概括拒絕。"},{"id":"113-行政法-12","year":"113","subject":"行政法","tag":"行政法","q":"有關行政罰與管制性不利處分之比較，下列敘述何者錯誤？","opts":["管制性不利處分不受裁罰權時效之限制","只有裁罰性不利處分適用處罰法定原則","相對於行政罰，管制性不利處分對人民權利影響較輕微","機關對裁罰性不利處分應依行為受責難程度、所生影響及不法利得決定"],"a":1,"ex":"行政罰與管制性不利處分的目的、要件及法律原則應分別判斷。","detail":"行政罰是對過去違反行政法義務行為的制裁；管制性不利處分則以預防危險、回復合法狀態為目的。管制措施未必比行政罰對權利影響輕微，仍須依法律保留、比例原則等審查。"},{"id":"113-行政法-13","year":"113","subject":"行政法","tag":"行政法","q":"依行政罰法規定與我國學理，法律或自治條例均可作為處罰依據。下列相關敘述何者錯誤？","opts":["法律包括符合授權明確性原則之法規命令","自治條例不包括職業團體內部之自治規章","法律不包括具有間接對外效力之行政規則","自治條例包括與大學自治相關之自治規章"],"a":2,"ex":"本題考處罰法定及法律、自治條例的規範範圍。","detail":"行政罰法第4條要求處罰須有法律或自治條例依據；授權明確的法規命令得在授權範圍內具體化處罰規定。職業團體或大學自治規章不當然等同自治條例，不能任意擴張處罰法源。"},{"id":"113-行政法-14","year":"113","subject":"行政法","tag":"行政法","q":"有關公務員責任之敘述，下列何者正確？","opts":["行政懲處與司法懲戒併行制度違憲","同一行為，不受懲戒法院二次懲戒","對懲戒法庭判決不服者，得另向行政法院起訴","對政務官嚴重違法失職行為，得予以行政懲處"],"a":2,"ex":"公務員懲戒與行政懲處的競合及一事不再理是本題核心。","detail":"行政懲處與司法懲戒的性質、目的及法定程序不同，制度上得有一定程度併行。不能把『同一行為不得二次懲戒』誤解為所有行政懲處與司法懲戒一律不得併存；本題要辨明懲戒法院的法定權限與救濟。"},{"id":"113-行政法-15","year":"113","subject":"行政法","tag":"行政法","q":"依政府資訊公開法，有關政府資訊應否公開之敘述，下列何者錯誤？","opts":["政府機關以預算補助特定企業之補助金等資訊，應主動公開","牽涉國防預算且依法核定為國家機密者，得不主動公開","書面公共工程及採購契約應主動公開","合議制機關之會議紀錄應主動公開"],"a":2,"ex":"官方備註：本題答 B 或 D 均給分。","detail":"政府資訊公開法第6條等規定要求主動公開特定資訊，但國家機密、個人隱私及合議制機關會議紀錄等另有例外或限制。本題官方公告 B、D 均給分，複習時以官方更正為準，不宜只背單一選項。"},{"id":"113-行政法-16","year":"113","subject":"行政法","tag":"行政法","q":"甲因配合店家宣傳改名，後悔欲申請改名，主管機關認為符合姓名條例所稱「特殊原因」。此處「特殊原因」屬於何種行政法概念？","opts":["判斷餘地","裁量餘地","裁量基準","不確定法律概念"],"a":4,"ex":"不確定法律概念是法律要件用語需經解釋、涵攝的概念。","detail":"『特殊原因』是法律構成要件中的不確定法律概念，須先解釋其意義，再將個案事實涵攝其中；不是行政機關在數個合法方案間自由選擇的裁量權。"},{"id":"113-行政法-17","year":"113","subject":"行政法","tag":"行政法","q":"有關行政處分與行政契約之比較，下列敘述何者正確？","opts":["基於契約相對性，行政契約無從產生對第三人拘束效力","信賴保護原則適用對象包括行政處分與行政契約之相對人","具有對第三人效力之行政處分，其效力發生繫於第三人事前同意","行政契約或行政處分對第三人效力均以法規明定為前提"],"a":2,"ex":"信賴保護原則可適用於行政處分及行政契約的相對人。","detail":"信賴保護不只可能出現在授益行政處分，也可能適用於行政契約相對人。行政契約仍受誠信、平等及依法行政等公法原則拘束，不能因契約形式就排除信賴保護。"},{"id":"113-行政法-18","year":"113","subject":"行政法","tag":"行政法","q":"行政機關於颱風期間為避免緊急危險，引水進入尚未完工之分洪隧道，應屬何種行政措施？","opts":["定暫時狀態之假處分","維護人民生命財產之保全處分","防止損害擴大之暫時性行政處分","行政執行法上之即時強制"],"a":4,"ex":"即時強制是為排除現在急迫危險而採取的即時措施。","detail":"行政執行法第36條以下的即時強制，是為排除現在急迫危害，於必要時即時對人或物採取措施；不以先作成行政處分或完成一般執行程序為必要，但仍受必要性及比例原則限制。"},{"id":"113-行政法-19","year":"113","subject":"行政法","tag":"行政法","q":"下列何者為具有法效性之單方行政行為？","opts":["具對第三人效力之行政處分","具間接對外效力之行政指導","不須第三人同意之行政契約","具可代替性之行政事實行為"],"a":1,"ex":"行政處分是具有法效性的單方行政行為。","detail":"行政處分是行政機關單方作成、直接發生公法效果的行政行為。行政指導通常不具法律拘束力；行政契約則以雙方合意為基礎；事實行為本身也不以法律效果為必要。"},{"id":"113-行政法-20","year":"113","subject":"行政法","tag":"行政法","q":"有關行政罰之敘述，下列何者正確？","opts":["裁罰性不利處分亦包括強制拆除","警告性處分只是單純警告，並不屬於行政罰","行為後法律有變更者，適用最初行為時之法律","公布違法者姓名影響權益輕微，無須適用法律保留原則"],"a":1,"ex":"警告性處分是否屬行政罰，須依其是否具裁罰性判斷。","detail":"行政罰須具有裁罰性。強制拆除若目的在排除違法狀態、回復合法秩序，通常屬管制或行政執行措施，不因對人民不利就當然是行政罰；仍應依措施目的及法律性質判斷。"},{"id":"113-行政法-21","year":"113","subject":"行政法","tag":"行政法","q":"關於行政契約，下列敘述何者正確？","opts":["行政契約屬公法契約，故不得準用民法規定","契約締結後如有情事重大變更，當事人一方得依法終止契約","準用民法結果雖為無效，但依行政程序法並不當然無效","如無自願接受執行約定，得準用民事訴訟法強制執行規定"],"a":2,"ex":"行政程序法對情事重大變更設有調整或終止契約的規範。","detail":"行政程序法第147條處理行政契約成立後情事重大變更：若依原約定顯失公平，當事人得請求調整或終止。行政契約並非完全排除民法規定，法律也設有準用規則。"},{"id":"113-行政法-22","year":"113","subject":"行政法","tag":"行政法","q":"有關行政契約與行政法一般原則之敘述，下列何者正確？","opts":["行政契約設定公法關係，不適用法律優位原則","基於私法自治原則授權，公法關係得以行政契約設定、變更或消滅","不得締結行政契約者，其契約約款仍應適用比例原則","以甄選方式決定當事人，事先公告資格係落實正當法律程序原則"],"a":4,"ex":"行政契約仍受依法行政等一般原則拘束；甄選公告涉及程序正當性。","detail":"行政契約雖以合意成立，仍受法律優位、法律保留、比例及正當程序等公法原則拘束。以甄選方式選定契約相對人，事先公告資格與標準，是程序透明及公平的重要要求。"},{"id":"113-行政法-23","year":"113","subject":"行政法","tag":"行政法","q":"依行政程序法，有關人民向行政機關提出之陳情，下列敘述何者正確？","opts":["機關應組成陳情處理委員會迅速回應","言詞陳情得不作紀錄並作成暫時性保全行政處分","陳情事項屬得提起訴願、訴訟或請求國賠者，陳情人仍得依法提起","陳情有保密必要，機關仍得基於公益公開"],"a":3,"ex":"提出陳情不妨礙人民依法提起訴願、訴訟或請求國家賠償。","detail":"人民陳情不會取代法定救濟。即使機關受理陳情，若事項本來可以提起訴願、行政訴訟或請求國家賠償，人民仍須遵守各該法定要件及期間。"},{"id":"113-行政法-24","year":"113","subject":"行政法","tag":"行政法","q":"關於法規命令與行政規則之比較，下列敘述何者正確？","opts":["均得依職權舉行聽證訂定","均須先於政府公報發布","均得依人民提議訂定","均得為行政法之成文法源"],"a":4,"ex":"法規命令與行政規則的對外效力、訂定程序及法源地位不同。","detail":"行政法法源包含成文法規及一定範圍內的行政法一般原則、習慣法等。行政規則通常拘束機關內部，但可能透過平等原則、自我拘束等方式間接影響外部；須區分其直接法規效力與間接外部效果。"},{"id":"113-行政法-25","year":"113","subject":"行政法","tag":"行政法","q":"有關行政機關之授權與裁量權，下列敘述何者正確？","opts":["非授予利益之合法行政處分，得由原機關依職權裁量廢止","依法規授權私人行使公權力時，私人並得制定法規命令","行政機關締結行政契約須以法規事先明確授權為前提","機關有裁量權時，得授權私人與其他私人締結行政契約"],"a":1,"ex":"行政處分的廢止須區分授益與非授益處分及法定要件。","detail":"行政程序法第123條規範合法授益行政處分的廢止；非授益處分的撤銷、廢止須依不同條文及要件判斷。題目用語要分清『撤銷』通常針對違法處分溯及失效，『廢止』通常針對合法處分向將來失效。"},{"id":"113-行政法-26","year":"113","subject":"行政法","tag":"行政法","q":"下列何者不屬於行政處分之附款？","opts":["保留負擔之事後附加","保留負擔之事後變更","保留行政處分之廢止權","保留行政處分之撤銷權"],"a":4,"ex":"附款類型包括期限、條件、負擔、保留廢止權及保留事後附加或變更負擔等。","detail":"行政處分附款包括期限、條件、負擔、保留廢止權，以及保留事後附加或變更負擔。『保留撤銷權』不是法定附款類型；撤銷與廢止的法律原因及效力不同。"},{"id":"113-行政法-27","year":"113","subject":"行政法","tag":"行政法","q":"下列何者為行政事實行為？","opts":["警察分局長下令違法集會群眾解散","內政部訂定治安顧慮人口查訪辦法","軍事學校對學生所為退學處分","警校對新生實施入學前預備教育"],"a":4,"ex":"預備教育屬實際執行活動，通常為行政事實行為。","detail":"行政事實行為是行政機關實際執行活動，通常不直接發生法律效果。警校對新生實施入學前預備教育是實際教育訓練；退學處分、命令解散及訂定法規則各有不同法律性質。"},{"id":"113-行政法-28","year":"113","subject":"行政法","tag":"行政法","q":"下列何者係以高等行政法院高等行政訴訟庭為第一審管轄法院？","opts":["交通裁決事件","收容聲請事件","都市計畫審查事件","不服行政機關所為新臺幣100萬元罰鍰事件"],"a":3,"ex":"都市計畫審查事件有專屬管轄規定。","detail":"都市計畫審查事件依行政訴訟法特別規定，由高等行政法院高等行政訴訟庭為第一審管轄。交通裁決、收容聲請及一般罰鍰案件則各有不同的專屬或通常管轄規則。"},{"id":"113-行政法-29","year":"113","subject":"行政法","tag":"行政法","q":"考試錄取參加基礎訓練人員，如不服保訓會廢止受訓資格之行政處分，應如何救濟？","opts":["向保訓會提起復審","向考試院提起訴願","向原分發機關上級機關提起訴願","向受訓機關上級機關提起訴願"],"a":2,"ex":"應依作成行政處分機關及其法定救濟體系判斷。","detail":"不服保訓會作成的受訓資格廢止處分，救濟應依公務人員保障及訴願制度的法定管轄判斷。本題答案為向考試院提起訴願；不要只按受訓地點或原分發機關推定管轄。"},{"id":"113-行政法-30","year":"113","subject":"行政法","tag":"行政法","q":"下列何者並非行政罰法明定之阻卻違法事由？","opts":["依法令之行為","依所屬上級公務員職務命令之行為","不可抗力之行為","緊急避難之行為"],"a":2,"ex":"行政罰法第11、12條等規定列有依法令及緊急避難等阻卻違法事由。","detail":"行政罰法明定的阻卻違法事由包括依法令行為、依上級公務員職務命令行為、正當防衛及緊急避難等。不可抗力可能影響故意過失或責任成立，但不是本題所問的法定阻卻違法事由選項。"},{"id":"113-行政法-31","year":"113","subject":"行政法","tag":"行政法","q":"下列有關損失補償責任之敘述，何者正確？","opts":["依警察職權行使法，人民有可歸責事由時不予補償","依行政執行法，有可歸責人民事由者，法院得減免補償金額","依警械使用條例，有可歸責第三人事由時得減輕或免除補償","依行政程序法廢止授益處分，受益人信賴損失均不予補償"],"a":3,"ex":"警械使用條例的損失補償，須注意可歸責第三人的效果。","detail":"警械使用造成特別犧牲時，依警械使用條例及相關規定處理損失補償；若損害發生可歸責於第三人，得依法減輕或免除補償。須區分國家賠償的違法責任與合法公權力行使的損失補償。"},{"id":"113-行政法-32","year":"113","subject":"行政法","tag":"行政法","q":"受理訴願機關不得為下列何種決定？","opts":["不受理","在訴願人表示不服範圍內，逕為加重處罰之變更","發回原行政處分機關另為處分","課予義務訴願指定期間命機關作成處分"],"a":2,"ex":"訴願決定不得在訴願人不服範圍內作更不利益變更。","detail":"訴願法禁止不利益變更：原處分相對人提起訴願時，訴願機關原則上不得在其不服範圍內加重處分。這是保障人民救濟權，避免因提起救濟反而處境更差。"},{"id":"113-行政法-33","year":"113","subject":"行政法","tag":"行政法","q":"行政法人對監督機關所為行政處分認為違法或不當而損害其權利或利益時，如何救濟？","opts":["不得提起救濟","得提起申訴","得提起訴願","得提起復審"],"a":3,"ex":"行政法人與監督機關間的行政處分，得依訴願制度救濟。","detail":"行政法人雖具公法人地位，與監督機關間若發生監督機關對其作成行政處分的情形，依法得循訴願途徑救濟。需留意行政法人不是一般私人法人，也不是公務員個人。"},{"id":"113-行政法-34","year":"113","subject":"行政法","tag":"行政法","q":"下列有關行政救濟時效之敘述，何者正確？","opts":["訴願應自處分達到或公告期滿日起30日內提起","訴願機關2個月不決定即可逕向行政法院起訴","課予義務訴訟原則上應於訴願決定送達後3個月內提起","行政訴訟抗告應於裁定送達後10日內提起"],"a":4,"ex":"行政訴訟抗告期間為裁定送達後10日的不變期間。","detail":"行政訴訟法規定，對裁定提起抗告，原則上應於裁定送達後10日的不變期間內提出。訴願及課予義務訴訟另有不同期間，考試常以30日、2個月及3個月作混淆。"},{"id":"113-行政法-35","year":"113","subject":"行政法","tag":"行政法","q":"下列有關國家賠償法制之敘述，何者正確？","opts":["國賠法公務員僅限依公務人員任用法任用者","開放山域自然公物設施已適當警告，人民仍冒險受損，國家仍負完全賠償責任","警察違法使用警械侵害人民權利，不適用國賠法","警察重大過失違法使用警械，賠償義務機關不得向其求償"],"a":4,"ex":"國賠法及警械使用條例涉及賠償義務機關對故意或重大過失人員的求償。","detail":"警察違法使用警械致人民權利受侵害，仍可能成立國家賠償；賠償義務機關對有故意或重大過失的公務員，依法可能有求償權。應區分國家對人民的外部賠償責任與機關對公務員的內部求償。"},{"id":"113-行政法-36","year":"113","subject":"行政法","tag":"行政法","q":"有關公務員之懲戒，下列敘述何者正確？","opts":["撤職停止任用期間為6個月以上、5年以下","同一行為已受刑罰或行政罰者不得懲戒","監察院對薦任第9職等以上公務員得逕予懲戒","行政懲處後又經懲戒法院判決不受懲戒確定，原行政懲處失效"],"a":4,"ex":"同一行為的行政懲處與懲戒程序關係，須依懲戒法規定判斷。","detail":"公務員懲戒與行政懲處不是完全相同的制度。題目涉及懲戒法院判決確定後，行政懲處的效力如何處理，應依公務員懲戒法的特別規定判斷，不能直接套用刑事一事不再理。"},{"id":"113-行政法-37","year":"113","subject":"行政法","tag":"行政法","q":"有關行政執行法之管收，下列敘述何者正確？","opts":["由行政執行官逕行裁定","不服管收裁定得提起抗告","管收期限最長為5年","義務人公法上金錢給付義務因管收執行完畢而免除"],"a":2,"ex":"管收裁定的救濟方式為抗告。","detail":"管收須由法院裁定，行政執行機關不能自行作成管收裁定；對管收裁定不服得依法抗告。管收是確保行政執行的手段，不代表公法上金錢給付義務因管收而消滅。"},{"id":"113-行政法-38","year":"113","subject":"行政法","tag":"行政法","q":"依行政程序法，公法上請求權之請求權人為人民時，原則上因多久期間不行使而消滅？","opts":["15年","10年","5年","3年"],"a":2,"ex":"行政程序法第131條：人民對行政機關之公法上請求權，原則上為10年。","detail":"行政程序法第131條規定，人民對行政機關的公法上請求權，原則上因10年間不行使而消滅；行政機關對人民的公法上請求權另有規範。題目問請求權人為人民，答案是10年。"},{"id":"113-行政法-39","year":"113","subject":"行政法","tag":"行政法","q":"下列何者非屬行政罰法所定之處罰種類？","opts":["罰款","命令停工","命令解散","公布姓名"],"a":1,"ex":"行政罰法的處罰種類包含罰鍰、沒入及其他裁罰性不利處分；本題依官方答案為 A。","detail":"行政罰法列舉的法定處罰名稱是『罰鍰』，不是口語常說的『罰款』。停工、解散或公布姓名可能依個別法律構成其他裁罰性不利處分；本題依官方答案選 A，關鍵在法定用語。"},{"id":"113-行政法-40","year":"113","subject":"行政法","tag":"行政法","q":"下列何者應適用行政程序法之程序規定？","opts":["刑事案件犯罪偵查程序","犯罪矯正機關為達成收容目的所為之行為","對公務人員所為一次記二大過之免職處分","考試院有關考選命題及評分之行為"],"a":3,"ex":"公務人員一次記二大過免職的程序適用問題，為本題考點。","detail":"行政程序法有若干適用除外事項，例如刑事偵查、矯正機關達成收容目的的行為，以及考試院考選命題評分等。公務人員一次記二大過免職屬對外影響身分權益的措施，仍須注意程序保障。"},{"id":"113-行政法-41","year":"113","subject":"行政法","tag":"行政法","q":"下列有關地方自治法規之敘述，何者正確？","opts":["自律規則由地方行政機關發布並報上級政府備查","自治條例與基於法律授權之法規牴觸者，無效","剝奪或限制居民權利義務得以自治規則定之","委辦規則毋須函報委辦機關核定"],"a":2,"ex":"自治條例與上位法規牴觸的效力，以及自治規則的規範事項是重點。","detail":"地方制度法區分自治條例、自治規則、自律規則及委辦規則。自治條例與法律或基於法律授權的法規牴觸時，依地方制度法處理其效力；限制居民權利義務原則上不能只靠自治規則。"},{"id":"113-行政法-42","year":"113","subject":"行政法","tag":"行政法","q":"有關行政法人之敘述，下列何者錯誤？","opts":["屬公法人性質","國家太空中心屬之","地方自治團體均不得設立行政法人","不服行政法人行政處分，得向監督機關提起訴願"],"a":3,"ex":"地方自治團體依法得設立行政法人，並非一律不得。","detail":"行政法人是依法設立、執行公共任務的公法人；地方自治團體在法律授權範圍內也得設立行政法人，因此不能說地方自治團體一律不得設立。行政法人行政處分的救濟另依監督及訴願規範處理。"},{"id":"113-行政法-43","year":"113","subject":"行政法","tag":"行政法","q":"下列何者非屬公務員服務法適用之對象？","opts":["現役軍人","公營事業機構純勞工以外之人員","中央研究院兼任行政職務之研究技術人員","中央警察大學未兼任行政職務之教授"],"a":4,"ex":"服務法適用對象須依身分及是否兼任行政職務判斷。","detail":"公務員服務法適用範圍須依法律所定身分判斷。中央警察大學未兼任行政職務的教授，不因任職於警察大學就當然成為服務法適用對象；兼任行政職務則須另行判斷。"},{"id":"113-行政法-44","year":"113","subject":"行政法","tag":"行政法","q":"直轄市山地原住民區之性質為何？","opts":["公法人","行政法人","行政機關","行政單位"],"a":1,"ex":"直轄市山地原住民區具有地方自治團體地位，屬公法人。","detail":"直轄市山地原住民區具有地方自治團體地位，依法為公法人，享有自治及自治財政等法定權限。不要與行政法人、行政機關或機關內部行政單位混淆。"},{"id":"113-行政法-45","year":"113","subject":"行政法","tag":"行政法","q":"下列何者非屬行政單位？","opts":["臺北市政府警察局保安警察大隊","新北市政府警察局板橋分局板橋派出所","內政部警政署行政組","內政部警政署勤務指揮中心"],"a":1,"ex":"行政單位與行政機關的組織法定位需區分；本題依官方答案為 A。","detail":"行政機關內部的行政單位通常不具獨立對外行使公權力及作成行政處分的組織地位；大隊等編制是否為機關或單位，應依組織法規及編制判斷。本題依官方答案選 A。"},{"id":"113-行政法-46","year":"113","subject":"行政法","tag":"行政法","q":"下列有關公權力行政之敘述，何者錯誤？","opts":["又稱高權行政","不得以行政契約方式為之","適用公法規定所為之行政行為","救濟途徑為行政爭訟與國家賠償程序"],"a":2,"ex":"公權力行政並非一概不得以行政契約方式進行。","detail":"公權力行政又稱高權行政，原則上適用公法並受行政爭訟及國家賠償制度規範，但不代表只能用單方行政處分。法律允許時，公權力行政也可能透過行政契約實現。"},{"id":"113-行政法-47","year":"113","subject":"行政法","tag":"行政法","q":"下列有關私經濟行政之敘述，何者錯誤？","opts":["又稱國庫行政","公營事業機構營利行為屬之","警察機關與廠商簽訂警槍採購契約不屬之","有爭議應循民事訴訟程序處理"],"a":3,"ex":"行政機關採購契約通常屬私經濟行政，選項敘述需對照契約性質。","detail":"私經濟行政又稱國庫行政，包含政府以私法方式從事採購、營利或財產管理。警察機關與廠商簽訂警槍採購契約，通常是政府採購的私法契約，故說『不屬之』是錯誤敘述。"},{"id":"113-行政法-48","year":"113","subject":"行政法","tag":"行政法","q":"依層級化法律保留理論及司法院大法官解釋意旨，公務人員保險金請求權消滅時效屬於何者？","opts":["憲法保留","絕對法律保留","相對法律保留","非屬法律保留"],"a":2,"ex":"涉及公務人員保險給付請求權消滅時效的法律保留層級。","detail":"公務人員保險給付請求權的消滅時效涉及人民（公務人員）重要財產權及權利行使期限，依層級化法律保留理論，應由法律明定，屬絕對法律保留的重要考點。"},{"id":"113-行政法-49","year":"113","subject":"行政法","tag":"行政法","q":"合目的性原則係屬下列何者？","opts":["適當性原則","必要性原則","狹義比例原則","法益衡量原則"],"a":1,"ex":"合目的性對應比例原則中的適當性原則。","detail":"比例原則中的適當性原則，又稱合目的性或適合性：所採手段必須有助於達成行政目的。必要性要求有多種同樣有效手段時選擇侵害最小者；狹義比例則衡量利益與損害。"},{"id":"113-行政法-50","year":"113","subject":"行政法","tag":"行政法","q":"下列何者之信賴利益值得保護？","opts":["以詐欺方法使行政機關作成行政處分者","對重要事項提供不正確資料致機關據以作成處分者","對重要事項為不完全陳述致機關據以作成處分者","因輕微過失而不知行政處分違法者"],"a":4,"ex":"信賴保護須考量受益人是否明知或因重大過失而不知處分違法。","detail":"行政程序法第119條列出信賴不值得保護的情形，包括以詐欺、脅迫或賄賂取得處分、對重要事項提供不正確或不完全資料，以及明知或因重大過失而不知處分違法。僅有輕微過失而不知違法，尚非當然排除信賴保護。"}];

function save(){localStorage.setItem("pocketDeck113",JSON.stringify(deck));localStorage.setItem("pocketState",JSON.stringify(state));stats()}

function draw(i){viewDeck=deck;current=(i+viewDeck.length)%viewDeck.length;let c=viewDeck[current];document.getElementById("qid").textContent=c.id;document.getElementById("topic").textContent=c.tag||c.subject;document.getElementById("question").textContent=c.q;let wrap=document.getElementById("options");wrap.innerHTML="";c.opts.forEach((o,j)=>{let b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+j)+". "+o;b.onclick=()=>answer(j);wrap.appendChild(b)});document.getElementById("reveal").classList.remove("show");document.getElementById("answer").textContent="";document.getElementById("explain").textContent="";document.getElementById("detail").textContent="";document.getElementById("fav").textContent=state.favorites.includes(c.id)?"★ 已收藏":"☆ 收藏";document.getElementById("wrongBtn").textContent=state.wrong.includes(c.id)?"已列入錯題 ✓":"標記錯題";document.getElementById("info").textContent=`113年警察人員升官等考試｜行政警察人員｜行政法｜共 ${deck.length} 題。` ;stats()}
function answer(j){let c=viewDeck[current],buttons=[...document.querySelectorAll(".opt")];if(buttons.some(b=>b.disabled))return;state.seen=[...new Set([...state.seen,c.id])];buttons.forEach((b,k)=>{b.disabled=true;if(k===c.a-1||(c.id.endsWith("15")&&k===3))b.classList.add("correct");if(k===j&&j!==c.a-1&&!(c.id.endsWith("15")&&j===3))b.classList.add("wrong")});document.getElementById("reveal").classList.add("show");document.getElementById("answer").textContent="正確答案："+(c.id.endsWith("15")?"B 或 D（官方備註均給分）":String.fromCharCode(64+c.a));document.getElementById("explain").textContent="考點摘要："+(c.ex||"請參照法規及官方試題解析。");document.getElementById("detail").textContent="逐題解析：\n"+(c.detail||"請搭配法條複習。");save()}
function showList(ids,label){let list=deck.filter(c=>ids.includes(c.id));if(!list.length){alert(label+"目前是空的。");return}let old=deck;deck=list;draw(0);document.getElementById("info").textContent=label+`｜${list.length} 題`;document.getElementById("next").onclick=()=>draw((current+1)%deck.length);document.getElementById("random").onclick=()=>draw(Math.floor(Math.random()*deck.length));document.getElementById("all").onclick=()=>{deck=old;wire();draw(0)}}
function wire(){document.getElementById("next").onclick=()=>draw((current+1)%deck.length);document.getElementById("random").onclick=()=>draw(Math.floor(Math.random()*deck.length));document.getElementById("all").onclick=()=>alert(`113年行政法 ${deck.length} 題｜已答 ${state.seen.length}｜收藏 ${state.favorites.length}｜錯題 ${state.wrong.length}`)}
document.getElementById("next").onclick=()=>draw((current+1)%deck.length);document.getElementById("random").onclick=()=>draw(Math.floor(Math.random()*deck.length));document.getElementById("fav").onclick=()=>{let id=viewDeck[current].id;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();draw(current)};document.getElementById("wrongBtn").onclick=()=>{let id=viewDeck[current].id;state.wrong=state.wrong.includes(id)?state.wrong.filter(x=>x!==id):[...state.wrong,id];save();draw(current)};
document.getElementById("review").onclick=()=>showList(state.wrong,"錯題複習");document.getElementById("favorites").onclick=()=>showList(state.favorites,"收藏卡片");document.getElementById("all").onclick=()=>alert(`113年行政法 ${deck.length} 題｜已答 ${state.seen.length}｜收藏 ${state.favorites.length}｜錯題 ${state.wrong.length}`);document.getElementById("reset").onclick=()=>{if(confirm("清除本機答題、收藏、錯題紀錄？")){state={seen:[],favorites:[],wrong:[]};save();draw(0)}};
document.getElementById("import").onclick=()=>document.getElementById("file").click();document.getElementById("file").onchange=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{let lines=reader.result.split(new RegExp("\\r?\\n")).filter(x=>x.trim());let rows=lines.slice(1).map((line,idx)=>{let p=line.split(",").map(x=>x.trim().replace(/^"|"$/g,""));if(p.length<10)return null;return{id:p[0]||"import-"+idx,year:p[1],subject:p[2],tag:p[3],q:p[4],opts:p.slice(5,9),a:Number(p[9]),ex:p[10]||""}}).filter(x=>x&&x.opts.length===4&&x.a>=1&&x.a<=4);if(rows.length){deck=[...deck,...rows];save();draw(0);alert("已匯入 "+rows.length+" 張卡片。")}else alert("未辨識到卡片。CSV欄位：id,year,subject,tag,question,A,B,C,D,answer(1-4),explanation")};reader.readAsText(f,"UTF-8")};
draw(0);stats();
</script></body></html>
