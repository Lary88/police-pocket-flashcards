};function flat(){return Object.values(data).flat()}
let deck=flat(), filtered=deck, cur=0, chosen=null;function loadState(){try{return JSON.parse(localStorage.getItem('pocketAdminLawState')||'{}')}catch{return {}}}
let state=Object.assign({seen:[],wrong:[],favorites:[]},loadState());
const yearSelect=document.getElementById('yearSelect'); yearSelect.innerHTML='<option value="all">全部年度</option>'+Object.keys(data).sort().map(y=>`<option value="${y}">${y} 年</option>`).join('');
function persist(){localStorage.setItem('pocketAdminLawState',JSON.stringify(state));updateStats()}
function updateStats(){document.getElementById('total').textContent=filtered.length;document.getElementById('seenCount').textContent=state.seen.length;document.getElementById('wrongCount').textContent=state.wrong.length}
function answerText(ans){return Array.isArray(ans)?ans.join('、'):ans}
function current(){return filtered[cur]}
function draw(index=cur){if(!filtered.length){document.getElementById('question').textContent='此年度沒有題目';document.getElementById('options').innerHTML='';return}cur=(index+filtered.length)%filtered.length;chosen=null;const q=current();document.getElementById('qid').textContent=`${q.year} 年｜第 ${q.number} 題`;document.getElementById('topic').textContent=q.subject;document.getElementById('question').textContent=q.question;let options=document.getElementById('options');options.innerHTML='';q.options.forEach((opt,i)=>{let b=document.createElement('button');b.className='opt';b.textContent='ABCD'[i]+'. '+opt;b.onclick=()=>mark(i);options.appendChild(b)});document.getElementById('reveal').classList.remove('show');document.getElementById('answer').textContent='';document.getElementById('explain').textContent='';refreshButtons();updateStats()}
function mark(i){const q=current();if(chosen!==null)return;chosen=i;state.seen.push(q.id);state.seen=[...new Set(state.seen)];let ans=q.answer;let correct=Array.isArray(ans)?ans.map(a=>'ABCD'.indexOf(a)):ans?'ABCD'.indexOf(ans):-1;document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(correct.includes(j))b.classList.add('correct');if(ans&&j===i&&!correct.includes(j))b.classList.add('wrong')});document.getElementById('reveal').classList.add('show');document.getElementById('answer').textContent=ans?`官方答案：${answerText(ans)}`:'官方答案：尚未取得，暫不判分';document.getElementById('explain').textContent=ans?`題目來源：官方試題。${q.explanation||'逐題解析尚待整理，請依題目與法規複習。'}`:'此年度已收到試題，但本批資料未附官方答案。';if(ans&&!correct.includes(i)){state.wrong.push(q.id);state.wrong=[...new Set(state.wrong)]}persist();refreshButtons()}
function refreshButtons(){let q=current();document.getElementById('favBtn').textContent=state.favorites.includes(q.id)?'★ 已收藏':'☆ 收藏';document.getElementById('wrongBtn').textContent=state.wrong.includes(q.id)?'✓ 已標記錯題':'標記錯題'}
function filterYear(){let y=yearSelect.value;filtered=y==='all'?deck:deck.filter(q=>q.year===y);cur=0;draw(0)}
yearSelect.onchange=filterYear;document.getElementById('next').onclick=()=>draw(cur+1);document.getElementById('prev').onclick=()=>draw(cur-1);document.getElementById('random').onclick=()=>draw(Math.floor(Math.random()*filtered.length));document.getElementById('favBtn').onclick=()=>{let id=current().id;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];persist();refreshButtons()};document.getElementById('wrongBtn').onclick=()=>{let id=current().id;state.wrong=state.wrong.includes(id)?state.wrong.filter(x=>x!==id):[...state.wrong,id];persist();refreshButtons()};
function showList(ids,title){let panel=document.getElementById('listPanel');panel.classList.add('show');document.getElementById('listTitle').textContent=title;let items=ids.map(id=>deck.find(q=>q.id===id)).filter(Boolean);let div=document.getElementById('listItems');div.innerHTML='';items.forEach(q=>{let b=document.createElement('button');b.className='opt';b.style.marginTop='8px';b.textContent=`${q.year}年 Q${q.number}｜${q.question}`;b.onclick=()=>{let y=yearSelect.value;if(y!=='all'&&y!==q.year)yearSelect.value=q.year;filtered=yearSelect.value==='all'?deck:deck.filter(x=>x.year===yearSelect.value);draw(filtered.findIndex(x=>x.id===q.id));panel.classList.remove('show')};div.appendChild(b)});if(!items.length)div.textContent='目前沒有紀錄。'}
document.getElementById('wrongReview').onclick=()=>showList(state.wrong,'錯題複習');document.getElementById('bottomWrong').onclick=()=>showList(state.wrong,'錯題複習');document.getElementById('favReview').onclick=()=>showList(state.favorites,'收藏題目');document.getElementById('bottomFav').onclick=()=>showList(state.favorites,'收藏題目');document.getElementById('closeList').onclick=()=>document.getElementById('listPanel').classList.remove('show');document.getElementById('statsBtn').onclick=()=>alert(`行政法題庫共 ${filtered.length} 題\n已答：${state.seen.length}\n錯題：${state.wrong.length}\n收藏：${state.favorites.length}`);function reset(){if(confirm('清除本機答題、收藏及錯題紀錄？')){state={seen:[],wrong:[],favorites:[]};persist();draw(0)}}document.getElementById('reset').onclick=reset;document.getElementById('resetBottom').onclick=reset;
